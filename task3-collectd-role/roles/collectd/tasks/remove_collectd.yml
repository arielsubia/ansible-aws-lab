---
- name: Stop collectd service
  ansible.builtin.systemd:
    name: collectd
    state: stopped
    enabled: false
  ignore_errors: true

- name: Remove collectd packages
  ansible.builtin.apt:
    name:
      - collectd
      - collectd-core
      - collectd-utils
    state: absent
    purge: true

- name: Remove collectd configuration directory
  ansible.builtin.file:
    path: /etc/collectd
    state: absent

- name: Remove collectd data directory
  ansible.builtin.file:
    path: /var/lib/collectd
    state: absent
