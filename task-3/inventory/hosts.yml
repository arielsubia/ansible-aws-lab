---
all:
  children:
    managed_nodes:
      hosts:
        node1:
          ansible_host: <node1-public-ip>
        node2:
          ansible_host: <node2-public-ip>
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/ansible-key.pem
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
